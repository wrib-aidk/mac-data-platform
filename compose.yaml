# PostgreSQL (수집·추출 데이터 DB)
#   docker compose up -d        # 시작 (start-dagster.sh 가 자동으로 실행)
#   docker compose down         # 중지 (데이터는 volume 에 남음)
# 접속 정보는 .env 의 POSTGRES_* 를 씀. 다른 PC 로 옮길 때는 scripts/db_backup.sh 참고.
name: mac-data-platform

services:
  postgres:
    image: postgres:17.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"   # 이 PC 에서만 접속 가능
    volumes:
      - pgdata:/var/lib/postgresql/data
    command: ["postgres", "-c", "shared_buffers=1GB", "-c", "work_mem=64MB", "-c", "maintenance_work_mem=512MB", "-c", "max_wal_size=4GB"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 20

volumes:
  pgdata:
