[project]
name = "mac-data-platform"
version = "0.1.0"
description = "wrib-crawler 수집 파이프라인을 Dagster로 관리"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dagster==1.13.29",
    "dagster-webserver==1.13.29",
    "dagster-dg-cli",
    "pypdfium2",
    "pyyaml",
    "requests",
    "pyarrow>=26.0.1",
    "psycopg[binary]>=3.3.8",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mac_data_platform"]

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "mac_data_platform"
registry_modules = ["mac_data_platform.components.*"]
